name: CI

# Mechanical merge gate: typecheck + build must pass on every PR to main.
# `npm run build` runs `tsc --noEmit && vite build`, so this covers types and
# the production build in one step. Configure a branch-protection rule on `main`
# requiring the "build" check to make this gate enforceable.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
